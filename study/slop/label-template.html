<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slop labelling</title>
<style>
:root{
  --bg:#faf6ef; --card:#fffdf9; --ink:#2b2721; --dim:#6d6459; --line:#e3dad0;
  --slop:#b4442f; --good:#2f6b4f; --accent:#8a5a2b;
  --fs:19px; --lh:1.8; --ff:"Verdana","Segoe UI",system-ui,sans-serif;
}
[data-theme="dark"]{ --bg:#1c1a18; --card:#242120; --ink:#e8e2d9; --dim:#a49a8d; --line:#3a3530;
  --slop:#e08265; --good:#7dbb98; --accent:#d3a76b; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 140px}

header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px 0 12px;z-index:20}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.count{font-size:15px;font-weight:700;letter-spacing:.02em}
.count b{font-size:22px;color:var(--accent)}
.bar{flex:1;min-width:160px;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.left{font-size:14px;color:var(--dim)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);
  background:var(--card);color:var(--dim);border-radius:8px;cursor:pointer}
.tools button:hover{border-color:var(--accent);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:34px 40px;margin-top:22px}
.meta{font-size:13px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.passage{font-size:var(--fs);line-height:var(--lh);max-width:64ch;
  letter-spacing:.012em;word-spacing:.06em;text-align:left;white-space:pre-wrap;
  overflow-wrap:break-word;hyphens:none}
.passage.spaced p, .passage.spaced{--pgap:1.6em}

.choose{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:2px solid var(--line);padding:14px 20px;z-index:30}
.choose .inner{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.big{font:inherit;font-size:17px;font-weight:700;padding:14px 26px;border-radius:12px;
  border:2px solid;cursor:pointer;background:transparent;min-width:150px}
.big.slop{color:var(--slop);border-color:var(--slop)}
.big.slop:hover,.big.slop.on{background:var(--slop);color:#fff}
.big.good{color:var(--good);border-color:var(--good)}
.big.good:hover,.big.good.on{background:var(--good);color:#fff}
.big .k{display:block;font-size:11px;font-weight:400;opacity:.75;letter-spacing:.08em}
.conf{display:flex;gap:6px;align-items:center}
.conf span{font-size:13px;color:var(--dim);margin-right:4px}
.conf button{font:inherit;font-size:14px;padding:9px 14px;border-radius:9px;
  border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
.conf button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip{font:inherit;font-size:14px;padding:9px 14px;border-radius:9px;border:1px dashed var(--line);
  background:transparent;color:var(--dim);cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);border-style:solid}
.note{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);flex:1;min-width:180px}
.nav{margin-left:auto;display:flex;gap:8px}
.nav button{font:inherit;font-size:15px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}

.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.grid button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
.grid button.slop{background:var(--slop);color:#fff;border-color:var(--slop)}
.grid button.good{background:var(--good);color:#fff;border-color:var(--good)}
.grid button.cur{outline:3px solid var(--accent);outline-offset:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 28px;margin-top:22px}
.panel h2{margin:0 0 10px;font-size:19px}
.panel p{color:var(--dim);font-size:15px;line-height:1.65;margin:0 0 14px;max-width:62ch}
textarea{width:100%;height:260px;font-family:ui-monospace,Consolas,monospace;font-size:13px;
  line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink)}
.done{background:var(--good);color:#fff;border:none;padding:13px 22px;border-radius:10px;
  font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-right:8px}
.hidden{display:none}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;font-family:inherit;font-size:12px}
</style></head><body>
<div class="wrap">
<header>
  <div class="hrow">
    <div class="count">Passage <b id="cur">1</b> of <span id="tot">30</span></div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="left" id="left"></div>
  </div>
  <div class="tools">
    <button onclick="fs(1)">A+</button><button onclick="fs(-1)">A−</button>
    <button onclick="font()">Font: <span id="fname">Verdana</span></button>
    <button onclick="lh()">Line spacing</button>
    <button onclick="theme()">Light / dark</button>
    <button onclick="jump()">Next unlabelled</button>
    <button onclick="show('sheet')">Finish &amp; export</button>
  </div>
</header>

<div id="main">
  <div class="card">
    <div class="meta"><span id="pw"></span><span id="stat"></span></div>
    <div class="passage" id="text"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="sheet" class="panel hidden">
  <h2>Your labels</h2>
  <p>Select all of this and paste it into <b>SLOP-LABELS.tsv</b>, replacing everything
  that is in there. Or click Download and tell me where it landed. Either works.</p>
  <textarea id="out" readonly></textarea>
  <p style="margin-top:14px">
    <button class="done" onclick="copy()">Copy to clipboard</button>
    <button class="done" onclick="dl()">Download file</button>
    <button class="done" style="background:var(--dim)" onclick="show('main')">Back to labelling</button>
  </p>
  <p id="warn"></p>
</div>
</div>

<div class="choose" id="bottom">
  <div class="inner">
    <button class="big slop" id="bslop" onclick="set('slop')">SLOP<span class="k">press S</span></button>
    <button class="big good" id="bgood" onclick="set('good')">GOOD<span class="k">press G</span></button>
    <div class="conf"><span>sure?</span>
      <button id="c1" onclick="conf('high')">high <kbd>1</kbd></button>
      <button id="c2" onclick="conf('medium')">med <kbd>2</kbd></button>
      <button id="c3" onclick="conf('low')">low <kbd>3</kbd></button>
    </div>
    <button class="chip" id="comp" onclick="comp()">competent but empty <kbd>C</kbd></button>
    <input class="note" id="note" placeholder="notes (optional)" oninput="noteIn(this.value)">
    <div class="nav">
      <button id="prev" onclick="go(-1)">← back</button>
      <button id="next" onclick="go(1)">next →</button>
    </div>
  </div>
</div>

<script id="data" type="application/json">/*__PASSAGES__*/</script>
<script>
var P = JSON.parse(document.getElementById('data').textContent);
var KEY = 'slop-labels-v1';
var S = load();
var i = 0;
function load(){ try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} 
  return P.map(function(p){return {n:p.n,label:'',confidence:'',notes:''}}); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function render(){
  var p=P[i], s=S[i];
  document.getElementById('cur').textContent=i+1;
  document.getElementById('tot').textContent=P.length;
  document.getElementById('pw').textContent=p.words+' words';
  document.getElementById('text').textContent=p.text;
  var n=S.filter(function(x){return x.label}).length;
  document.getElementById('bar').style.width=(n/P.length*100)+'%';
  document.getElementById('left').textContent=(P.length-n)+' left';
  document.getElementById('stat').textContent=s.label?('marked '+s.label.toUpperCase()):'not yet marked';
  document.getElementById('bslop').className='big slop'+(s.label==='slop'?' on':'');
  document.getElementById('bgood').className='big good'+(s.label==='good'?' on':'');
  ['high','medium','low'].forEach(function(c,k){
    document.getElementById('c'+(k+1)).className=(s.confidence===c?'on':''); });
  document.getElementById('comp').className='chip'+(/competent/i.test(s.notes)?' on':'');
  document.getElementById('note').value=s.notes;
  document.getElementById('prev').disabled=(i===0);
  document.getElementById('next').disabled=(i===P.length-1);
  window.scrollTo(0,0);
  grid();
}
function grid(){
  var g=document.getElementById('grid'); g.innerHTML='';
  S.forEach(function(s,k){
    var b=document.createElement('button');
    b.textContent=k+1; b.className=(s.label||'')+(k===i?' cur':'');
    b.onclick=function(){ clearTimeout(adv); i=k; render(); }; g.appendChild(b);
  });
}
var adv=null;
function set(v){ S[i].label=(S[i].label===v?'':v); save(); render();
  // Auto-advance, but slowly enough to set confidence first, and cancelled the
  // moment you touch a confidence key. Round 1 advanced in 260ms and ate every
  // confidence mark before it could be pressed.
  clearTimeout(adv);
  if(S[i].label && i<P.length-1){
    document.getElementById('stat').textContent='marked '+S[i].label.toUpperCase()+' - moving on, press 1/2/3 to stay';
    adv=setTimeout(function(){ if(i<P.length-1){i++;render();} },1600); } }
function conf(c){ clearTimeout(adv); S[i].confidence=c; save(); render(); }
function comp(){ var t=S[i].notes||'';
  S[i].notes = /competent/i.test(t) ? t.replace(/competent,?\s?/i,'').trim() : (t?('competent, '+t):'competent');
  save(); render(); }
function noteIn(v){ S[i].notes=v; save(); }
function go(d){ clearTimeout(adv); var j=i+d; if(j>=0&&j<P.length){ i=j; render(); } }
function jump(){ for(var k=0;k<P.length;k++){ var j=(i+1+k)%P.length; if(!S[j].label){ i=j; render(); return; } }
  show('sheet'); }
function tsv(){ return 'n\tlabel\tconfidence\tnotes\n'+S.map(function(s){
  return s.n+'\t'+s.label+'\t'+s.confidence+'\t'+(s.notes||'').replace(/\t/g,' '); }).join('\n')+'\n'; }
function show(w){
  var done=w==='sheet';
  document.getElementById('main').className=done?'hidden':'';
  document.getElementById('sheet').className=done?'panel':'panel hidden';
  document.getElementById('bottom').style.display=done?'none':'';
  if(done){ document.getElementById('out').value=tsv();
    var miss=S.filter(function(s){return !s.label}).length;
    document.getElementById('warn').textContent = miss?(miss+' passage(s) still blank. The analysis script will skip them and say so.'):'All '+P.length+' labelled.';
    document.getElementById('warn').style.color = miss?'var(--slop)':'var(--good)'; }
}
function copy(){ var t=document.getElementById('out'); t.select();
  try{ document.execCommand('copy'); alert('Copied. Paste it into SLOP-LABELS.tsv'); }catch(e){ alert('Select the text and copy manually.'); } }
function dl(){ var b=new Blob([tsv()],{type:'text/tab-separated-values'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='SLOP-LABELS.tsv';
  document.body.appendChild(a); a.click(); a.remove(); }

var FONTS=[['Verdana','"Verdana",Geneva,sans-serif'],['Segoe UI','"Segoe UI",system-ui,sans-serif'],
  ['Georgia','Georgia,"Times New Roman",serif'],['Comic Sans','"Comic Sans MS","Segoe UI",sans-serif'],
  ['Tahoma','Tahoma,Verdana,sans-serif']];
var fi=0, size=19, lhv=1.8;
function fs(d){ size=Math.min(30,Math.max(15,size+d)); document.documentElement.style.setProperty('--fs',size+'px'); }
function font(){ fi=(fi+1)%FONTS.length; document.documentElement.style.setProperty('--ff',FONTS[fi][1]);
  document.getElementById('fname').textContent=FONTS[fi][0]; }
function lh(){ lhv = lhv>=2.4?1.6:lhv+0.4; document.documentElement.style.setProperty('--lh',lhv); }
function theme(){ var d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark'); }

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  var k=e.key.toLowerCase();
  if(k==='s'){ set('slop'); e.preventDefault(); }
  else if(k==='g'){ set('good'); e.preventDefault(); }
  else if(k==='c'){ comp(); e.preventDefault(); }
  else if(k==='1'){ conf('high'); } else if(k==='2'){ conf('medium'); } else if(k==='3'){ conf('low'); }
  else if(k==='arrowright'||k==='n'){ go(1); } else if(k==='arrowleft'||k==='p'){ go(-1); }
});
render();
</script></body></html>
