name: Weekly trend refresh

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (~8am ET)
  workflow_dispatch: {}     # allows manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Research and update trend data
        run: node scripts/refresh.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Heartbeat commit (keeps this schedule enabled)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-refresh
          git config user.name "humansounding-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .last-refresh
          git commit -m "Weekly refresh heartbeat" || echo "nothing to commit"
          git push || echo "nothing to push"
